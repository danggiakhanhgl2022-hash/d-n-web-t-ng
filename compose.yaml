services:
  db:
    image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    container_name: video-os-stage1-db
    env_file: .env.postgres
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_os -d video_os"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  pgdata:
    name: video-os-stage1-pgdata

