<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Video OS — Client Intake and Information Gate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff7ab8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#glow)"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="120" font-size="64" font-weight="800" fill="#ffffff">Video OS</text>
    <rect x="66" y="138" width="120" height="6" rx="3" fill="url(#ac)"/>
    <text x="64" y="196" font-size="28" fill="#d9d4ee">Turn the messy first step of a video ad</text>
    <text x="64" y="232" font-size="28" fill="#d9d4ee">into a structured, auditable workflow.</text>
    <g font-size="18" font-weight="600" fill="#ffffff">
      <rect x="64" y="272" width="170" height="40" rx="20" fill="#7c5cff" fill-opacity="0.9"/><text x="149" y="298" text-anchor="middle">Questionnaire</text>
      <text x="248" y="299" fill="#a99cff">→</text>
      <rect x="272" y="272" width="130" height="40" rx="20" fill="#7c5cff" fill-opacity="0.75"/><text x="337" y="298" text-anchor="middle">Evidence</text>
      <text x="416" y="299" fill="#a99cff">→</text>
      <rect x="440" y="272" width="150" height="40" rx="20" fill="#7c5cff" fill-opacity="0.6"/><text x="515" y="298" text-anchor="middle">Review gate</text>
      <text x="604" y="299" fill="#a99cff">→</text>
      <rect x="628" y="272" width="170" height="40" rx="20" fill="url(#ac)"/><text x="713" y="298" text-anchor="middle">Approved brief</text>
    </g>
    <g transform="translate(1000 70)" fill="none" stroke="url(#ac)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="210" height="150" rx="16" stroke-opacity="0.9"/>
      <path d="M85 45 L140 75 L85 105 Z" fill="url(#ac)" stroke="none"/>
      <path d="M30 175 H180" stroke-opacity="0.5"/>
      <path d="M60 200 H150" stroke-opacity="0.3"/>
    </g>
  </g>
</svg>
